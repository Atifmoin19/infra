# Shared backend server: Caddy (only public entrypoint) + one container per backend.
# Local:  CADDYFILE=Caddyfile.local docker compose up -d --build   (see README)
# Prod:   docker compose up -d --build

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  caddy:
    <<: *hardening
    build:
      context: ./caddy
    image: infra/caddy:local
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Directory mount (not single files) so `git pull` + `caddy reload` picks up edits;
    # single-file bind mounts keep pointing at the old inode after git replaces the file.
    command: ["caddy", "run", "--config", "/etc/caddy/${CADDYFILE:-Caddyfile}", "--adapter", "caddyfile"]
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edge
      - portfolio_net
      - expense_edge
      - dayline_edge
    depends_on:
      portfolio-api:
        condition: service_started
      expense-api:
        condition: service_started
      dayline-api:
        condition: service_started

  portfolio-api:
    <<: *hardening
    build:
      # Source checkout + override Dockerfile (relative to the context, or absolute).
      # Defaults fit the dev Mac layout; the VM sets these in .env (see .env.vm.example).
      context: ${PORTFOLIO_SRC:-../NextPortfolio/Backend}
      dockerfile: ${PORTFOLIO_DOCKERFILE:-../../infra/services/portfolio/Dockerfile}
    image: infra/portfolio-api:local
    env_file:
      - ./env/portfolio.env
    environment:
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
    volumes:
      - type: bind
        source: ./secrets/portfolio/firebase-service-account.json
        target: /run/secrets/firebase-service-account.json
        read_only: true
        bind:
          create_host_path: false   # fail loudly if the secret is missing
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 384m
    # no `ports:` - reachable only via Caddy on portfolio_net
    networks:
      - portfolio_net

  # ---------------------------------------------------------------- expense (All Square)
  expense-api:
    <<: *hardening
    build:
      context: ${EXPENSE_SRC:-../ExpenseTrackerBE}
      dockerfile: ${EXPENSE_DOCKERFILE:-../infra/services/expense/Dockerfile}
    image: infra/expense-api:local
    env_file:
      - ./env/expense.env
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 384m
    depends_on:
      expense-db:
        condition: service_healthy
    networks:
      - expense_net    # db (internal)
      - expense_edge   # Caddy + outbound internet (EmailJS, Google, S3)

  expense-db:
    <<: *hardening
    image: postgres:16-alpine
    user: "70:70"      # postgres user in the alpine image; skips the root entrypoint path
    env_file:
      - ./env/expense-db.env
    volumes:
      - expense_db_data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    shm_size: 128m
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - expense_net

  # ---------------------------------------------------------------- nightly pg_dump
  # One container dumps every BACKUP_<NAME>_URL in env/backup.env to ./backups/<name>/.
  # To add a DB: add its URL to env/backup.env and its *_net network below.
  # Run now: docker compose exec backup /bin/sh /opt/backup/backup.sh once
  backup:
    <<: *hardening
    image: postgres:16-alpine
    user: "70:70"
    entrypoint: ["/bin/sh", "/opt/backup/backup.sh"]
    env_file:
      - ./env/backup.env
    volumes:
      - ./backup:/opt/backup:ro
      - ./backups:/backups
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f backup.sh >/dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
    depends_on:
      expense-db:
        condition: service_healthy
    networks:
      - expense_net
      - dayline_net

  # ---------------------------------------------------------------- dayline (formerly TaskBoard)
  # One image (built by dayline-api) runs as api, Celery worker and Celery Beat.
  # Memory limits total 688m (api 192, worker 192, beat 96, db 144, redis 64); idle use ~310 MiB.
  # The worker keeps headroom for its `celery inspect ping` healthcheck (a second python process).
  dayline-api:
    <<: *hardening
    build:
      context: ${DAYLINE_SRC:-../taskboard/backend}
      dockerfile: ${DAYLINE_DOCKERFILE:-../../infra/services/dayline/Dockerfile}
    image: infra/dayline-api:local
    env_file:
      - ./env/dayline.env
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 192m
    depends_on:
      dayline-db:
        condition: service_healthy
      dayline-redis:
        condition: service_healthy
    networks:
      - dayline_net    # db + redis (internal)
      - dayline_edge   # Caddy + outbound internet

  dayline-worker:
    <<: *hardening
    image: infra/dayline-api:local
    pull_policy: never   # built by dayline-api
    command: ["celery", "-A", "celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - ./env/dayline.env
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    depends_on:
      dayline-api:          # api runs the migrations first
        condition: service_healthy
    networks:
      - dayline_net
      - dayline_egress # email / Slack / web push; not reachable by Caddy

  dayline-beat:
    <<: *hardening
    image: infra/dayline-api:local
    pull_policy: never
    # Schedule state on tmpfs: losing it on restart only means the next run fires on time anyway.
    command: ["celery", "-A", "celery_app.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule", "--pidfile="]
    env_file:
      - ./env/dayline.env
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 96m
    healthcheck:
      test: ["CMD-SHELL", "ls /tmp/celerybeat-schedule* >/dev/null 2>&1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      dayline-api:
        condition: service_healthy
    networks:
      - dayline_net

  dayline-db:
    <<: *hardening
    image: postgres:16-alpine
    user: "70:70"
    env_file:
      - ./env/dayline-db.env
    volumes:
      - dayline_db_data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    shm_size: 64m
    mem_limit: 144m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dayline_net

  dayline-redis:
    <<: *hardening
    image: redis:7-alpine
    user: "999:1000"   # redis user in the image
    env_file:
      - ./env/dayline-redis.env
    # Holds login sessions + the Celery queue, so keep an AOF on a volume: a restart
    # must not log everyone out. noeviction: never silently drop sessions/tasks.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --appendfsync everysec --save '' --maxmemory 48mb --maxmemory-policy noeviction"]
    volumes:
      - dayline_redis_data:/data
    read_only: true
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dayline_net

networks:
  # Caddy's public-facing network.
  edge:
  # One network per backend: Caddy joins all of them, backends can't reach each other.
  # Not `internal: true` because the API needs outbound internet (Firestore, Gemini, Resend).
  portfolio_net:
  # Postgres + its API (+ backup). internal: no internet, and Caddy/other services can't join it.
  expense_net:
    internal: true
  # Caddy <-> expense-api, also the API's route to the internet.
  expense_edge:
  dayline_net:
    internal: true
  dayline_edge:
  # Worker egress only (Caddy is not on it).
  dayline_egress:

volumes:
  caddy_data:
  caddy_config:
  expense_db_data:
  dayline_db_data:
  dayline_redis_data:
