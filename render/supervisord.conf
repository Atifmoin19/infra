; All logs go to the container's stdout (Render log stream); each line is prefixed with the
; program name by /opt/bin/lib.sh. Supervisor's own log is discarded.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=warn

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:caddy]
command=/opt/bin/start-caddy.sh
priority=10
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:health]
command=/opt/bin/start-health.sh
priority=20
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:portfolio]
command=/opt/bin/start-portfolio.sh
priority=30
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:expense]
command=/opt/bin/start-expense.sh
priority=30
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:dayline]
command=/opt/bin/start-dayline.sh
priority=30
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Memory sanity: restart a program whose RSS (incl. children) stays above its cap. The container
; has 512 MB; the apps idle at about 60-90 MB each.
[eventlistener:memmon]
command=/opt/venv-supervisor/bin/memmon -c -p portfolio=160MB -p expense=180MB -p dayline=200MB -p caddy=64MB -p health=40MB
events=TICK_60
; stdout is the event-listener protocol channel; only stderr is logged.
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
